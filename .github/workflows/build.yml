# Thanks @ssp97 for the initial work on this file.
name: Build ChatDACS One-Click-To-Deploy Package (ChatDACS一键运行包构建)

permissions:
  contents: read

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runs_on: ubuntu-24.04
            node_arch: x64
          - os: linux-arm64
            runs_on: ubuntu-24.04-arm
            node_arch: arm64
          - os: win-x64
            runs_on: windows-latest
            node_arch: x64
          - os: win-arm64
            runs_on: windows-11-arm
            # Keep x64 emulation for native dependencies without Windows ARM64
            # prebuilds (notably canvas). This is recorded in the manifest.
            node_arch: x64
          - os: macos-x64
            runs_on: macos-15-intel
            node_arch: x64
          - os: macos-arm64
            runs_on: macos-15
            node_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use project Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install canvas dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++

      - name: Install canvas dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install pkg-config cairo pango libpng jpeg giflib librsvg pixman

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Smoke production runtime
        run: node scripts/ci-runtime.js production

      - name: Install isolated packaging tool
        run: node scripts/ci-runtime.js tools

      - name: Build runtime bundle
        run: npm run package:release
        env:
          RELEASE_TARGET: ${{ matrix.os }}

      - name: Verify bundled runtime
        run: node scripts/ci-runtime.js bundle
        env:
          RELEASE_TARGET: ${{ matrix.os }}

      - name: Declare package metadata
        run: node scripts/ci-runtime.js metadata

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatDACS-${{ env.VERSION_NUMBER }}_${{ matrix.os }}_${{ env.BUILD_TIME }}
          path: |
            .release/ChatDACS-${{ env.VERSION_NUMBER }}_${{ matrix.os }}.zip
            .release/native-dependencies-${{ matrix.os }}.json
          if-no-files-found: error
