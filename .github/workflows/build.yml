# Thanks @ssp97 for the initial work on this file.
name: Build ChatDACS One-Click-To-Deploy Package (ChatDACS一键运行包构建)

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: 18.20.8

jobs:
  build:
    name: Build on ${{ matrix.os }} - Node 18.20.8
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runs_on: ubuntu-24.04
            node_arch: x64
          - os: linux-arm64
            runs_on: ubuntu-24.04-arm
            node_arch: arm64
          - os: win-x64
            runs_on: windows-latest
            node_arch: x64
          - os: win-arm64
            runs_on: windows-11-arm
            node_arch: arm64
          - os: macos-x64
            runs_on: macos-13
            node_arch: x64
          - os: macos-arm64
            runs_on: macos-latest
            node_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Remove go-cqhttp binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -LiteralPath '.\plugins\go-cqhttp\go-cqhttp' -ErrorAction SilentlyContinue

      - name: Remove go-cqhttp Windows helpers on Linux
        if: runner.os == 'Linux'
        run: |
          rm -f ./plugins/go-cqhttp/go-cqhttp_windows_amd64.exe
          rm -f ./plugins/go-cqhttp/go-cqhttp.bat

      - name: Install canvas dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Install isolated packaging tool
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'chatdacs-build-tools'
          npm install --prefix $toolRoot --no-save --package-lock=false archiver@7.0.1
          $archiverPath = Join-Path $toolRoot 'node_modules/archiver'
          "ARCHIVER_MODULE_PATH=$archiverPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build runtime bundle
        run: npm run package:release
        env:
          RELEASE_TARGET: ${{ matrix.os }}

      - name: Declare package metadata
        shell: bash
        run: |
          echo "VERSION_NUMBER=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatDACS-${{ env.VERSION_NUMBER }}_${{ matrix.os }}_${{ env.BUILD_TIME }}
          path: .release/ChatDACS-${{ env.VERSION_NUMBER }}_${{ matrix.os }}.zip
          if-no-files-found: error
