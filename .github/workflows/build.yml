# Thanks @ssp97 for the initial work on this file.
name: Build ChatDACS One-Click-To-Deploy Package (ChatDACS一键运行包构建)

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: 18.20.8

jobs:
  build:
    name: Build on ${{ matrix.os }} - Node 18.20.8
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runs_on: ubuntu-24.04
            node_arch: x64
          - os: linux-arm64
            runs_on: ubuntu-24.04-arm
            node_arch: arm64
          - os: win-x64
            runs_on: windows-latest
            node_arch: x64
          - os: win-arm64
            runs_on: windows-11-arm
            # Node 18 never shipped a Windows ARM64 runtime. Windows 11 ARM runs
            # this x64 bundle through its supported compatibility layer.
            node_arch: x64
          - os: macos-x64
            runs_on: macos-15
            node_arch: x64
          - os: macos-arm64
            runs_on: macos-latest
            node_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install canvas dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++

      - name: Install canvas dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install pkg-config cairo pango libpng jpeg giflib librsvg pixman

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Smoke production runtime
        run: npm run smoke:web

      - name: Install isolated packaging tool
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'chatdacs-build-tools'
          npm install --prefix $toolRoot --no-save --package-lock=false archiver@7.0.1
          $archiverPath = Join-Path $toolRoot 'node_modules/archiver'
          "ARCHIVER_MODULE_PATH=$archiverPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build runtime bundle
        run: npm run package:release
        env:
          RELEASE_TARGET: ${{ matrix.os }}

      - name: Verify bundled runtime
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath '.release/stage' -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'Release stage directory was not created.' }
          $runtimeName = if ($IsWindows) { 'node.exe' } else { 'node' }
          $runtime = Join-Path $bundle.FullName "runtime/$runtimeName"
          $runtimeVersion = & $runtime --version
          if ($runtimeVersion -ne "v${{ env.NODE_VERSION }}") {
            throw "Unexpected bundled Node version: $runtimeVersion"
          }
          Push-Location $bundle.FullName
          try { & $runtime --check index.js } finally { Pop-Location }

      - name: Declare package metadata
        shell: bash
        run: |
          echo "VERSION_NUMBER=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatDACS-${{ env.VERSION_NUMBER }}_${{ matrix.os }}_${{ env.BUILD_TIME }}
          path: .release/ChatDACS-${{ env.VERSION_NUMBER }}_${{ matrix.os }}.zip
          if-no-files-found: error

